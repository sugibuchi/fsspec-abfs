# Lint the code and the workflows, and test, on every push to main and pull
# request. The offline tests run on the dummy server, with no credentials, on
# every supported Python version. The coverage is uploaded to Codecov from one
# Python version: uploading needs the repository secret CODECOV_TOKEN.
#
# The live tests then run on Azure, in the GitHub environment `azure`, which
# DEVELOPMENT.md describes. An environment without AZURE_CLIENT_ID is skipped.
# Their results, with each test's runtime, go to Codecov's test analytics, from
# a job of their own, which holds no credential of the accounts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no job pushes: the token is not left in .git/config

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.22"  # not the latest uv: the same in every run

      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .

      # The workflows: their security (zizmor) and their syntax (actionlint).
      - name: Workflow check
        run: |
          uvx zizmor --offline .github/workflows
          uvx --from actionlint-py actionlint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no job pushes: the token is not left in .git/config
          fetch-depth: 0  # the version comes from the git tags (hatch-vcs)

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.22"  # not the latest uv: the same in every run
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked  # fails if uv.lock is out of date

      # The dummy server only, whatever a variable says: this job has no credentials.
      - name: Test with coverage
        run: uv run --no-sync pytest --api=dummy --cov --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.14' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  live:
    needs: test
    # Pull requests from forks and Dependabot get neither the environment's
    # variables nor an OIDC token trusted by Azure: they run offline only.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    environment: azure
    outputs:
      tested: ${{ steps.configured.outputs.ok }}
    permissions:
      contents: read
      id-token: write  # GitHub's OIDC token, for workload identity federation with Microsoft Entra ID
    concurrency:
      # One run at a time: each test works in a folder of its own, but the
      # accounts' throughput is shared.
      group: live-${{ github.ref }}
      cancel-in-progress: false
    env:
      # DefaultAzureCredential takes these for its WorkloadIdentityCredential.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      FSSPEC_ABFS_TEST_HNS_ACCOUNT_URL: ${{ vars.FSSPEC_ABFS_TEST_HNS_ACCOUNT_URL }}
      FSSPEC_ABFS_TEST_FLAT_ACCOUNT_URL: ${{ vars.FSSPEC_ABFS_TEST_FLAT_ACCOUNT_URL }}
      FSSPEC_ABFS_TEST_CONTAINER: ${{ vars.FSSPEC_ABFS_TEST_CONTAINER }}
    steps:
      # An environment not set up yet is skipped, not failed. The kinds of
      # account tested are those whose endpoint is set.
      - name: Check the environment
        id: configured
        run: |
          if [[ -z "$AZURE_CLIENT_ID" ]]; then
            echo "::notice::The environment azure has no AZURE_CLIENT_ID: skipped."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$AZURE_TENANT_ID" || -z "$FSSPEC_ABFS_TEST_CONTAINER" ]]; then
            echo "::error::AZURE_TENANT_ID and FSSPEC_ABFS_TEST_CONTAINER must be set."
            exit 1
          fi
          if [[ -n "$FSSPEC_ABFS_TEST_HNS_ACCOUNT_URL" && -n "$FSSPEC_ABFS_TEST_FLAT_ACCOUNT_URL" ]]; then
            hns=both
          elif [[ -n "$FSSPEC_ABFS_TEST_HNS_ACCOUNT_URL" ]]; then
            hns=true
          elif [[ -n "$FSSPEC_ABFS_TEST_FLAT_ACCOUNT_URL" ]]; then
            hns=false
          else
            echo "::error::FSSPEC_ABFS_TEST_HNS_ACCOUNT_URL or FSSPEC_ABFS_TEST_FLAT_ACCOUNT_URL must be set."
            exit 1
          fi
          echo "hns=$hns" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ steps.configured.outputs.ok == 'true' }}
        with:
          persist-credentials: false  # no job pushes: the token is not left in .git/config
          fetch-depth: 0  # the version comes from the git tags (hatch-vcs)

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: ${{ steps.configured.outputs.ok == 'true' }}
        with:
          version: "0.12.22"  # not the latest uv: the same in every run
          python-version: "3.14"
          enable-cache: false  # this job holds credentials: nothing restored from a cache

      - name: Install the project
        if: ${{ steps.configured.outputs.ok == 'true' }}
        run: uv sync --locked  # fails if uv.lock is out of date

      - name: Test on the live accounts
        if: ${{ steps.configured.outputs.ok == 'true' }}
        env:
          HNS: ${{ steps.configured.outputs.hns }}
        # junit.xml in the legacy JUnit form, which Codecov's test analytics reads, with each test's runtime.
        run: >-
          bash .github/scripts/with-id-token-file.sh uv run --no-sync pytest --api=live --hns="$HNS"
          --junitxml=junit.xml -o junit_family=legacy

      # Handed to live-results by GitHub's own action: Codecov's runs in a job
      # without the accounts' credential.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() && steps.configured.outputs.ok == 'true' }}
        with:
          name: live-results
          path: junit.xml
          if-no-files-found: error

  live-results:
    needs: live
    # Also after failed tests, whose runtimes count too: not when none ran.
    if: ${{ !cancelled() && needs.live.outputs.tested == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no job pushes: the token is not left in .git/config

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: live-results

      - name: Upload the live test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          flags: live
